<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control: Exam Flight Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#070a13;--card:#0e1326;--bd:rgba(255,255,255,.06);--tx:#e8edff;--dim:#7d8aae;--cy:#00f0ff;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:#080c18}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;padding:0 8px 18px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(0,240,255,.25),rgba(168,85,247,.25));border:1px solid rgba(0,240,255,.35)}
.nav{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--dim);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;border-left:3px solid transparent}
.nav:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.nav.on{color:var(--cy);background:linear-gradient(90deg,rgba(0,240,255,.14),rgba(0,240,255,.03));border-left-color:var(--cy)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--dim)}
main{min-width:0;padding:0 24px 40px}
header{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;padding:14px 0;background:rgba(7,10,19,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);margin:0 -24px;padding-left:24px;padding-right:24px;flex-wrap:wrap}
.crumb{font-weight:600;font-size:16px}.crumb span{color:var(--dim);font-weight:400}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:0 10px;color:var(--dim);min-width:200px}
.search input{background:none;border:0;color:var(--tx);padding:8px 0;font:inherit;width:100%;outline:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:#1b2550;border:1px solid rgba(0,240,255,.4);color:var(--cy)}
button.b,.b{font:inherit;color:var(--tx);background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:9px;padding:7px 11px;cursor:pointer;transition:background .15s}
.b:hover{background:rgba(255,255,255,.09)}
.b.dng:hover{border-color:#f43f5e;color:#f43f5e}
.b:focus-visible,.nav:focus-visible,input:focus-visible,summary:focus-visible,.t1:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-top:16px}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.card h2 em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-top:16px}
.st{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;border-top:2px solid var(--c);box-shadow:0 -10px 24px -14px var(--c)}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:rgba(255,255,255,.06);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid rgba(255,255,255,.15);border-color:color-mix(in srgb,var(--c) 32%,transparent)}
.lb{margin-top:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.vl{font-size:27px;font-weight:600;line-height:1.15;margin-top:2px}
.mb{height:5px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden}
.mb i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .4s}
.ch{display:block;margin-top:8px;font-size:12px;color:var(--dim)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:2px}
.tabs button{flex:1;min-width:112px;white-space:nowrap;text-align:center;font:inherit;color:var(--dim);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;cursor:pointer}
.tabs button[aria-selected=true]{color:#04121a;background:linear-gradient(135deg,#00f0ff,#7aa8ff);border-color:transparent;font-weight:600;box-shadow:0 0 22px rgba(0,240,255,.3)}
.tabs small{display:block;font-size:11px;opacity:.85}
.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cd{border:1px solid rgba(255,255,255,.15);border-color:color-mix(in srgb,var(--c) 38%,transparent);border-radius:12px;padding:11px;background:#0b1020;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 9%,#0b1020),#0b1020 70%)}
.cd b{color:var(--c);font-size:13px}.cd .t{font-size:19px;font-weight:600;margin:2px 0 6px}
input[type=date],input[type=number]{font:inherit;color:var(--tx);background:#080c1a;border:1px solid var(--bd);border-radius:8px;padding:5px 8px;color-scheme:dark;width:100%}
.pace{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-bottom:12px}
.pace b{color:var(--tx);font-weight:500}
.th{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.t1{text-align:center;border-radius:14px;padding:12px 6px;cursor:pointer;background:#0b1020;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 7%,#0c1124),#0b1020);border:1px solid rgba(255,255,255,.1);border-color:color-mix(in srgb,var(--c) 22%,transparent);transition:transform .15s,box-shadow .15s}
.t1:hover{transform:translateY(-2px)}
.t1.sel{box-shadow:0 0 26px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 0 1px var(--c)}
.nm{color:var(--c);font-weight:700;font-size:13px}
.tube{position:relative;height:210px;width:48px;margin:10px auto;background:linear-gradient(90deg,#050813,#0b1226,#050813);border:1px solid var(--bd);border-radius:24px;overflow:hidden}
.tube .f{position:absolute;bottom:0;left:0;right:0;background:var(--c);background:linear-gradient(0deg,var(--c),color-mix(in srgb,var(--c) 65%,#fff));box-shadow:0 0 22px var(--c);transition:height .4s}
.tube .k{position:absolute;left:0;width:12px;border-top:1px solid rgba(255,255,255,.35)}.tube .k.h{width:24px}
.badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.05em;padding:2px 8px;border-radius:99px;border:1px solid var(--c);color:var(--c)}
.badge.cc{background:var(--c);color:#04101a;animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 16px var(--c)}}
@media(prefers-reduced-motion:reduce){.badge.cc{animation:none}*{transition:none!important}}
.adj{display:flex;gap:4px;justify-content:center;margin-top:8px}.adj .b{padding:3px 6px;font-size:12px}
.hrs{font-size:12.5px}
.timer{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.clock{font-size:58px;font-weight:600;line-height:1;color:var(--c);text-shadow:0 0 18px var(--c)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ctl label{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}.ctl input{width:62px}
.pri{background:var(--c)!important;color:#04101a!important;font-weight:600;border-color:transparent}
.mod{border-left:3px solid var(--c);border-radius:12px;padding:12px 14px;margin-top:10px;background:#0b1020;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 8%,#0b1020),#0b1020 60%)}
.mod h3{margin:0;font-size:14px;color:var(--c)}.mod p{margin:2px 0 6px;color:var(--dim);font-size:12.5px}
.mod label{display:flex;gap:10px;align-items:flex-start;padding:4px 0;cursor:pointer}
.mod input{appearance:none;width:18px;height:18px;margin-top:1px;flex:none;border:1.5px solid var(--c);border-color:color-mix(in srgb,var(--c) 60%,transparent);border-radius:6px;background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .15s,box-shadow .15s}
.mod input:checked{background:var(--c);box-shadow:0 0 10px var(--c)}
.mod input:checked::after{content:"";width:5px;height:9px;border:solid #04101a;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.mod input:checked+span{color:var(--dim);text-decoration:line-through}
.hist{display:grid;grid-template-columns:90px repeat(5,1fr);gap:8px;align-items:center;font
